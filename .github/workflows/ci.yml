name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上后一次推送直接作废前一次还在跑的矩阵，别拿三版本算力排队
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# 门禁的顺序、集合、每道挡什么，全部定义在 scripts/gate.py。
# 这个文件只决定"哪个系统 / 哪个 Python 版本跑哪一层"，不再逐个列举脚本——
# 两处各写一份就会出现"本地绿、CI 红"。
#
# 为什么要加 Windows：v1.7.0 那个"版本比较恒相等"的 bug 只在 PowerShell 上出现，
# 输出串码也是 Windows 独有的。两个都是本地手跑才发现的，ubuntu 矩阵永远看不见。
# 一个只在一个平台上跑的门禁，等于没验另一个平台。
jobs:
  gates:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # 卡住的作业会白占 6 小时到默认超时。这套门禁正常 30 秒，给 15 分钟余量
    # 已经够宽松了；超了这个数一定是死循环或等待输入，不是在算。
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   python: "3.9",  tier: core }
          - { os: ubuntu-24.04,   python: "3.12", tier: full }
          - { os: ubuntu-24.04,   python: "3.13", tier: core }
          # Windows 跑全量：install.ps1、Junction、GBK 输出、路径分隔符都在这一条上
          - { os: windows-latest, python: "3.12", tier: full }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # 全量顺手产摘要；两个核心版本只跑 core，省时间
      - name: 门禁（全量）
        if: matrix.tier == 'full'
        run: python scripts/gate.py --markdown gate.md

      - name: 门禁（核心）
        if: matrix.tier == 'core'
        run: python scripts/gate.py --tier core

      - name: 单元测试（弃用警告视为失败，仅 3.13）
        if: matrix.python == '3.13'
        run: python -W error::DeprecationWarning -m unittest discover -s tests
        env:
          KOUMAOZI_SKIP_DOC_SMOKE: "1"

      - name: 摘要
        if: matrix.tier == 'full' && matrix.os == 'ubuntu-24.04'
        run: cat gate.md >> "$GITHUB_STEP_SUMMARY"

  # 门禁验的是源码目录，用户拿到的是装完之后的目录。两者之间还有一层：
  # 解压、放位置、写清单、PATH/编码适配。1.6.0 的"装完一跑门禁就红"就是漏在这里。
  #
  # 三个组合都要跑：install.sh 是 bash 一套，install.ps1 在 PS 5.1 和 pwsh 7 下
  # 行为并不完全一致（`$LASTEXITCODE`、原生参数拼接、中文码页都踩过），
  # 而用户机器上多半还是 5.1。
  install:
    name: 安装端到端 · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   label: "bash",   shell: bash }
          - { os: windows-latest, label: "PS 5.1", shell: powershell }
          - { os: windows-latest, label: "pwsh 7", shell: pwsh }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 打包是 gate 的 package 门禁的一部分（打完立刻解压自检），
      # 这里只调入口，不在 yml 里再写一遍打包规则
      - name: 打包
        run: python scripts/gate.py --only package

      # 装到 $HOME 下的模拟位置，不碰 runner 的真实 skills 目录
      - name: 安装（bash）
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          bash scripts/install.sh --from "dist/koumaozi-$(cat VERSION).zip" -y

      # install.ps1 走到最后会 exit，所以验证必须放在下一个 step
      - name: 安装（PowerShell）
        if: matrix.shell != 'bash'
        shell: ${{ matrix.shell }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = (Resolve-Path "dist/koumaozi-$version.zip").Path
          $target = Join-Path $env:RUNNER_TEMP "skills\koumaozi"
          & ".\scripts\install.ps1" -From $zip -Target $target -Yes

      - name: 装完之后真的能用
        shell: bash
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            installed="$RUNNER_TEMP/fakehome/.workbuddy/skills/koumaozi"
          else
            installed="$RUNNER_TEMP/skills/koumaozi"
          fi
          python scripts/install_smoke.py --installed "$installed"
