name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上后一次推送直接作废前一次还在跑的矩阵，别拿三版本算力排队
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# 门禁的顺序、集合、每道挡什么，全部定义在 scripts/gate.py。
# 这个文件只决定"哪个 Python 版本跑哪一层"，不再逐个列举脚本——
# 两处各写一份就会出现"本地绿、CI 红"。
jobs:
  gates:
    name: py${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # 3.12 跑全量并顺手产摘要；另外两个版本只跑核心，省时间
      - name: 门禁（全量，仅 3.12）
        if: matrix.python == '3.12'
        run: python scripts/gate.py --markdown gate.md

      - name: 门禁（核心）
        if: matrix.python != '3.12'
        run: python scripts/gate.py --tier core

      - name: 单元测试（弃用警告视为失败，仅 3.13）
        if: matrix.python == '3.13'
        run: python -W error::DeprecationWarning -m unittest discover -s tests
        env:
          KOUMAOZI_SKIP_DOC_SMOKE: "1"

      - name: 摘要
        if: matrix.python == '3.12'
        run: cat gate.md >> "$GITHUB_STEP_SUMMARY"
