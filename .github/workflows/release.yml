name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 打 tag 不等于推 main，ci.yml 的矩阵不一定在这个 commit 上跑过；
  # 就算跑过，也只是"源码目录能用"。发出去的包要装到用户机器上，
  # 装完能不能用必须单独验——而且要在发布之前验，不能发布之后再发现。
  verify-install:
    name: 安装端到端 · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   label: "bash",   host: bash }
          - { os: windows-latest, label: "PS 5.1", host: powershell }
          - { os: windows-latest, label: "pwsh 7", host: pwsh }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 打包是 gate 的 package 门禁的一部分（打完立刻解压自检），
      # 这里只调入口，不在 yml 里再写一遍打包规则
      - name: 打包
        run: python scripts/gate.py --only package

      - name: 安装（bash）
        if: matrix.host == 'bash'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          bash scripts/install.sh --from "dist/koumaozi-$(cat VERSION).zip" -y

      # install.ps1 走到最后会 exit，验证必须放到下一个 step。
      # 两个宿主分开写、各自硬编码 shell，不把 matrix 变量塞进 shell 字段：
      # 那个字段是解析期决定的，不支持表达式，写了整份 workflow 会被判成
      # 语法错误——现象是整个 run 变成 "workflow file issue"，连 job 都列不出来。
      - name: 安装（Windows 5.1）
        if: matrix.host == 'powershell'
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = (Resolve-Path "dist/koumaozi-$version.zip").Path
          $target = Join-Path $env:RUNNER_TEMP "skills\koumaozi"
          & ".\scripts\install.ps1" -From $zip -Target $target -Yes

      - name: 安装（Windows 7）
        if: matrix.host == 'pwsh'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = (Resolve-Path "dist/koumaozi-$version.zip").Path
          $target = Join-Path $env:RUNNER_TEMP "skills\koumaozi"
          & ".\scripts\install.ps1" -From $zip -Target $target -Yes

      - name: 装完之后真的能用
        shell: bash
        run: |
          if [ "${{ matrix.host }}" = "bash" ]; then
            installed="$RUNNER_TEMP/fakehome/.workbuddy/skills/koumaozi"
          else
            installed="$RUNNER_TEMP/skills/koumaozi"
          fi
          python scripts/install_smoke.py --installed "$installed"

  release:
    name: 打包 · 自检 · 发布
    needs: verify-install
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # gh release create --verify-tag 要 tag 在远端，checkout 也要能拿到它
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # tag 指向的 commit 很可能从没被 ci.yml 跑过（打 tag 不等于推 main），
      # 所以这里不能假设"CI 已经验过了"，必须自己再验一遍。
      # 用 Python 而不是 bash：同一段判断在 Windows 作业里也要能跑。
      - name: tag 与 VERSION 一致
        run: python scripts/release_check.py --tag "$GITHUB_REF_NAME"

      # gate.py 的 package 门禁已经打包 + 解压自检，dist/ 就是它产出的。
      # 这里不重复打一次——重复的步骤迟早会和 gate 里的定义漂开。
      - name: 全量门禁（含打包与产物自检）
        run: python scripts/gate.py --markdown gate.md

      - name: 生成 Release 说明
        run: python scripts/release_notes.py --out NOTES.md

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/koumaozi-$version.zip" "dist/koumaozi-$version.zip.sha256" \
            --verify-tag \
            --title "扣帽子工程 $GITHUB_REF_NAME" \
            --notes-file NOTES.md

      # 发布完成不等于交付对。把上传的资产拉回来，重新比对 sha256——
      # 这一步才能排除"本地验的是 A，发出去的是 B"。
      - name: 发布后回收复检
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          mkdir -p downloaded
          gh release download "$GITHUB_REF_NAME" --dir downloaded
          ls -l downloaded
          python scripts/release_check.py --tag "$GITHUB_REF_NAME" \
            --local "dist/koumaozi-$version.zip" \
            --remote "downloaded/koumaozi-$version.zip" \
            --sum "downloaded/koumaozi-$version.zip.sha256"

      - name: 摘要
        run: |
          cat gate.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "### 发布 $GITHUB_REF_NAME"
            echo ""
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo ""
            echo "安装：\`bash scripts/install.sh\` 或 \`scripts/install.ps1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时保留产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: koumaozi-dist-${{ github.ref_name }}
          path: |
            dist/
            NOTES.md
          if-no-files-found: ignore
